<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A4B">
<title>BookMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ===== palette ===== */
:root{
  --brand:#0B7A4B;--brand-d:#075233;--brand-l:#E3F4EA;--lime:#C8F25A;
  --ink:#10201A;--mut:#5F6F66;--line:#E2E8E3;--bg:#F1F4F1;--card:#FFFFFF;--soft:#F6F8F6;
  --amber:#E89A2C;--amber-l:#FDF1DD;--amber-d:#7C4E0E;--red:#C9473F;--red-l:#FBE7E5;--blue:#2F6FD1;--blue-l:#E4EDFB;
  --r:18px;--sh:0 1px 2px rgba(16,32,26,.06),0 4px 16px rgba(16,32,26,.06);
  --font:Calibri,Carlito,'Leelawadee UI',Leelawadee,Thonburi,'Noto Sans Thai',sans-serif;
  --rail:0px;--gut:16px;
}
@media (min-width:768px){:root{--rail:92px;--gut:28px}}
@media (min-width:1100px){:root{--rail:248px;--gut:40px}}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:16px;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:3px solid rgba(11,122,75,.35);outline-offset:2px}
.ic{flex:none;display:block}
h2>.ic:first-child,h3>.ic:first-child{display:inline-block;vertical-align:-3px;margin-right:4px}
h1{font-size:25px;font-weight:700;line-height:1.2}
h2{font-size:19px;font-weight:700}
h3{font-size:16.5px;font-weight:700;line-height:1.3}
b,strong{font-weight:700}
small{font-size:13px}
.mut{color:var(--mut)}
.sm-t{font-size:14px}
.wrap{max-width:1160px;margin:0 auto;padding:0 var(--gut)}
.narrow{max-width:600px}

/* ===== shell ===== */
.main{margin-left:var(--rail);min-height:100vh;min-height:100dvh;padding-bottom:96px}
.side{display:none}
@media (min-width:768px){
  .main{padding-bottom:40px}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--card);border-right:1px solid var(--line);z-index:30;padding:18px 10px}
  .side nav{display:flex;flex-direction:column;gap:4px;margin-top:18px;flex:1}
  .side nav button,.side-owner{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;font-size:12px;color:var(--mut);position:relative;text-align:center}
  .side nav button:hover,.side-owner:hover{background:var(--soft)}
  .side nav button.on{background:var(--brand-l);color:var(--brand-d);font-weight:700}
  .side-logo{display:flex;align-items:center;justify-content:center;gap:10px}
  .side-logo b{display:none}
  .side .dot{left:auto;right:16px}
}
@media (min-width:1100px){
  .side{padding:24px 16px}
  .side-logo{justify-content:flex-start;padding:0 8px}
  .side-logo b{display:block;font-size:20px}
  .side nav button,.side-owner{flex-direction:row;gap:12px;padding:12px 14px;font-size:15.5px;text-align:left}
  .side .dot{position:static;margin-left:auto}
}
.logo-m{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.side-owner{border:1px dashed var(--line)}

.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 16px rgba(16,32,26,.08);z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#8A988F;position:relative;padding:4px 0}
.tabbar button.on{color:var(--brand);font-weight:700}
@media (min-width:768px){.tabbar{display:none}}
.dot{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* ===== top / bars ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;padding-bottom:14px}
.hello{color:var(--mut);font-size:15px}
.top-act{display:flex;gap:8px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);flex:none;position:relative}
.iconbtn .dot{top:-2px;left:auto;right:-4px}
@media (min-width:768px){.top{padding-top:32px;padding-bottom:18px}h1{font-size:30px}.top .m-only{display:none}}
.bar{display:flex;align-items:center;gap:12px;padding-top:16px;padding-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar h1{font-size:20px}
@media (min-width:768px){.bar{padding-top:28px}.bar h1{font-size:26px}}

/* ===== inputs ===== */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);color:var(--mut);position:relative}
.search input{border:0;outline:0;flex:1;font-size:16px;background:none;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px var(--gut) 4px;margin:0 calc(var(--gut) * -1);scrollbar-width:none}
.chips::-webkit-scrollbar,.dates::-webkit-scrollbar,.friends::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 15px;border-radius:999px;background:var(--card);font-size:15px;border:1px solid var(--line)}
.chip:hover{border-color:#B9C6BE}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dates{display:flex;gap:8px;overflow-x:auto;padding:12px var(--gut) 4px;margin:0 calc(var(--gut) * -1);scrollbar-width:none}
.dchip{flex:none;width:56px;padding:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
.dchip small{color:var(--mut);font-size:12px}
.dchip b{font-size:20px}
.dchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dchip.on small{color:#CFEBDC}
.locchip{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--sh);font-size:15px;width:100%;text-align:left;margin-top:10px}
.locchip .ic{color:var(--brand)}
.locchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locchip u{color:var(--brand);text-decoration:none;font-weight:700}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 12px}
.sec-h span{color:var(--mut);font-size:14px;white-space:nowrap}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:0;background:var(--card)}
.field input:focus{border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== cards ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.feat{display:grid;gap:12px;margin-top:14px}
@media (min-width:768px){.feat{grid-template-columns:1fr 1fr}}
.promo{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:var(--r);padding:18px}
.promo .big{font-size:30px;font-weight:700;color:var(--lime);line-height:1}
.promo p{font-size:14px;color:#C9D6CF}
.mt-card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:linear-gradient(135deg,#0B7A4B,#0E9A5E);color:#fff;border-radius:var(--r);padding:18px}
.mt-card .ico{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.mt-card b{display:block}
.mt-card span{font-size:14px;color:#D2EFDF}
.up{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);width:100%;text-align:left;border-left:4px solid var(--brand)}
.datebox{width:54px;flex:none;text-align:center;background:var(--brand-l);color:var(--brand-d);border-radius:12px;padding:6px 0}
.datebox small{display:block;font-size:12px}
.datebox b{font-size:22px;line-height:1.1}

.vgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1280px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
@media (hover:hover){.vcard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,32,26,.06),0 10px 26px rgba(16,32,26,.1)}}
.vart{aspect-ratio:2/1;position:relative;overflow:hidden}
.vart svg{width:100%;height:100%;display:block}
.tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:var(--ink);font-size:13px;padding:4px 10px;border-radius:999px}
.tag.boost{left:auto;right:12px;background:var(--lime);font-weight:700}
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rate{display:flex;align-items:center;gap:3px;font-size:14px;color:var(--amber);font-weight:700;flex:none}
.rate .ic{fill:var(--amber)}
.meta{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--mut);margin:2px 0 8px;flex-wrap:wrap}
.meta.light{color:#E6F2EB}
.price{font-weight:700;font-size:18px}
.price small{color:var(--mut);font-weight:400}
.free{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-l);padding:3px 10px;border-radius:999px;white-space:nowrap}
.free.none{color:var(--red);background:var(--red-l)}
.times{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.tchip{font-size:14px;padding:5px 11px;border-radius:10px;border:1px solid var(--brand);color:var(--brand);font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.tchip:hover{background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--mut);padding:36px 16px;font-size:15px;grid-column:1/-1}
.empty .ic{margin:0 auto}

/* ===== venue ===== */
.vhero-wrap{max-width:1160px;margin:0 auto}
.hero{height:clamp(210px,58vw,300px);position:relative;color:#fff;overflow:hidden}
.hero svg.art{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.6))}
.hero .back{position:absolute;left:16px;top:16px;z-index:2}
.hero-t{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.hero-t .tag{position:static;display:inline-block;margin-bottom:6px}
@media (min-width:768px){.vhero-wrap{padding:24px var(--gut) 0}.hero{height:280px;border-radius:22px}.hero-t{left:24px;bottom:22px}.hero-t h1{font-size:32px}}
.vlayout{display:block}
.vaside,.coaside .d-only{display:none}
@media (min-width:1100px){
  .vlayout,.colayout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
  .vaside{display:block;position:sticky;top:24px;margin-top:16px}
  .coaside{position:sticky;top:90px}
  .coaside .d-only{display:flex}
  .cta.hide-d{display:none}
}
.seg{display:flex;background:#E3E9E4;border-radius:12px;padding:4px;margin:16px 0 4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:12px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:54px repeat(var(--n),minmax(0,1fr));gap:5px;margin-bottom:20px}
.gh{font-size:13px;font-weight:700;text-align:center;padding:4px 0;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{font-size:13px;color:var(--mut);display:flex;align-items:center}
.cell{height:42px;border-radius:10px;font-size:13px;font-weight:700;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--brand);transition:transform .08s;min-width:0}
@media (min-width:768px){.cell{height:46px;font-size:14px}.grid{gap:6px}}
.cell:active{transform:scale(.95)}
.cell.free:hover{border-color:var(--brand);background:var(--brand-l)}
.cell.booked{background:repeating-linear-gradient(135deg,#E9EDEA 0 6px,#F1F4F1 6px 12px);color:#98A69E;border-color:transparent}
.cell.queued{background:var(--amber-l);color:var(--amber-d);border-color:#F3CF94}
.cell.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.cell.mine{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.cell.blocked{background:#33413A;color:#C8D2CC;border-color:#33413A}
.cell.past{background:transparent;border-style:dashed;color:transparent;cursor:default}
.cta{position:fixed;bottom:0;left:var(--rail);right:0;background:var(--card);padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 20px rgba(16,32,26,.1);z-index:20;border-radius:20px 20px 0 0}
@media (min-width:768px){.cta{border-radius:0}}
.cta-t{font-size:14px;color:var(--mut)}
.cta-p{font-size:22px;font-weight:700}
.cta-p small{color:var(--mut);font-weight:400}
.cta-hint{font-size:14px;color:var(--mut);text-align:center;width:100%;padding:8px 0}
.btn{background:var(--brand);color:#fff;font-weight:700;padding:13px 22px;border-radius:14px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--brand-d)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.dark{background:var(--ink)}
.btn.amber{background:var(--amber)}
.btn.danger{background:var(--red)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
@media (min-width:768px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.fact small{color:var(--mut);display:block}
.fact b{font-size:15px}
.pitch-d{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-top:14px}
.pitch-d svg{width:100%;aspect-ratio:15/8;display:block;border-radius:12px}
.info-cols{display:grid;gap:0 12px}
@media (min-width:768px){.info-cols{grid-template-columns:1fr 1fr}}
.fac{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fac span{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--brand-l);color:var(--brand-d);padding:6px 11px;border-radius:999px}
.list li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border:0}
.minimap{height:200px;border-radius:14px;overflow:hidden;margin-top:10px;background:#E4EBE5;position:relative;z-index:0}
.rev{padding:12px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border:0}
.stars{color:var(--amber);letter-spacing:1px}
.bpanel h3{margin-bottom:6px}

/* ===== checkout / pay ===== */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;padding:5px 0}
.row.total{font-size:19px;font-weight:700;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.row .disc{color:var(--brand)}
.sum{display:flex;gap:12px;align-items:center}
.thumb{width:68px;height:68px;border-radius:14px;overflow:hidden;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left}
.sw{width:50px;height:30px;border-radius:999px;background:#CBD5CE;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}
.sw.on::after{left:23px}
.weeks{display:flex;gap:8px;margin-top:12px}
.weeks button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:var(--card)}
.weeks button.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d);font-weight:700}
.pm{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;text-align:left}
.pm.on{border-color:var(--brand);background:var(--brand-l)}
.pm .logo{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.pm .radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #B8C4BC;flex:none}
.pm.on .radio{border:6px solid var(--brand)}
.note{display:flex;gap:8px;font-size:14px;color:var(--mut);background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.note .ic{margin-top:2px}
.note.amber{background:var(--amber-l);color:var(--amber-d)}
.note.green{background:var(--brand-l);color:var(--brand-d)}
.qrwrap{text-align:center}
.pp-head{background:#113566;color:#fff;border-radius:14px 14px 0 0;padding:10px;font-weight:700;letter-spacing:.3px}
.qr{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:18px}
.qr svg{width:min(220px,60vw);aspect-ratio:1;height:auto}
.amt{font-size:32px;font-weight:700;margin-top:8px}
.spin{width:44px;height:44px;border:4px solid var(--brand-l);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.ok{text-align:center;padding:36px 0 10px}
.ok .tick{width:78px;height:78px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 0 0 10px var(--brand-l)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;margin-top:12px}
.pill.g{background:var(--brand-l);color:var(--brand-d)}
.pill.a{background:var(--amber-l);color:var(--amber-d)}
.ticket{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin:18px 0 12px}
.ticket .tt{background:var(--ink);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.ticket .tt b{color:var(--lime);letter-spacing:1px}
.ticket .tb{padding:14px 16px}

/* ===== bookings / notifs ===== */
.bgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:768px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bk{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column}
.bk-top{display:flex;gap:12px;align-items:center}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mut);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge.g{background:var(--brand-l);color:var(--brand-d)}
.badge.a{background:var(--amber-l);color:var(--amber-d)}
.bk-act{display:flex;gap:8px;margin-top:auto;padding-top:12px}

.backdrop{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:1000;animation:fd .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:1001;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}

/* ============ slot logic ============ */
const dist=v=>km(D.loc,v);
const fmtKm=v=>{const d=dist(v);return d<10?d.toFixed(1):Math.round(d)};
const skey=(v,c,d,h)=>`${v}|${c}|${d}|${h}`;
function baseBooked(v,c,d,h){const wd=parse(d).getDay();let p=(h>=17&&h<=20)?60:(h>=12?24:16);if(wd===0||wd===6)p+=15;return hash(v+c+d+h)%100<p}
function covers(b,d){if(b.date===d)return true;if(!b.repeat)return false;const x=dayDiff(b.date,d);return x>0&&x%7===0&&x/7<b.repeat}
const isDone=(id,on)=>D.done.some(x=>x.id===id&&x.on===on);
const mineAt=(v,c,d,h)=>D.bookings.find(b=>b.venue===v&&b.court===c&&b.hours.includes(h)&&covers(b,d)&&!isDone(b.id,d));
const inQueue=(v,c,d,h)=>D.queue.find(q=>q.key===skey(v,c,d,h));
function slotState(v,c,d,h){
  const k=skey(v,c,d,h);
  if(mineAt(v,c,d,h))return 'mine';
  if(D.blocks[k])return 'blocked';
  if(D.walkins[k])return 'booked';
  if(d<TODAY||(d===TODAY&&h<=nowH()))return 'past';
  if(D.released[k])return 'free';
  return baseBooked(v,c,d,h)?'booked':'free';
}
function freeHours(v,d){const x=V(v);return HOURS.filter(h=>x.courts.some((_,c)=>slotState(v,c,d,h)==='free'))}
function freeCount(v,d){const x=V(v);let n=0;HOURS.forEach(h=>x.courts.forEach((_,c)=>{if(slotState(v,c,d,h)==='free')n++}));return n}
const firstFreeCourt=(v,d,h)=>V(v).courts.findIndex((_,c)=>slotState(v,c,d,h)==='free');
const upcoming=()=>{const out=[];D.bookings.forEach(b=>{for(let w=0;w<(b.repeat||1);w++){const d=addDays(b.date,w*7);if(isDone(b.id,d))continue;if(d>TODAY||(d===TODAY&&Math.max(...b.hours)>=nowH()))out.push({...b,on:d,week:w+1})}});return out.sort((a,b)=>(a.on+String(a.hours[0]).padStart(2,'0')).localeCompare(b.on+String(b.hours[0]).padStart(2,'0')))};
function avail(pid,d,h){const wd=parse(d).getDay();let p=pid==='me'?82:((h>=17&&h<=20)?62:44);if(wd===0||wd===6)p+=12;return hash(pid+d+h+'mt')%100<p}

function initMap(){

  else{const slot=$('#mapbox-m');if(slot)slot.remove()}
  if(!window.L){el.innerHTML='<div class="mapfail">โหลดแผนที่ไม่ได้ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต<br>ยังเลือกพื้นที่จากช่องค้นหาด้านบนได้</div>';return}
  MAP=L.map(el,{zoomControl:true,scrollWheelZoom:true}).setView([D.loc.lat,D.loc.lng],13);

function oState(c,d,h){const k=skey(OWNER_V,c,d,h);const m=mineAt(OWNER_V,c,d,h);
  if(m)return {s:'ob',name:'Nice',src:'BookMatch',paid:true};
  if(D.blocks[k])return {s:'blocked'};
  if(D.walkins[k])return {s:D.walkins[k].src==='โทร'?'oc':'ow',name:D.walkins[k].name,src:D.walkins[k].src,paid:false};
  if(D.released[k]||!baseBooked(OWNER_V,c,d,h))return {s:'free'};
  const r=hash(k+'s')%10,src=r<7?'BookMatch':r<9?'โทร':'หน้าสนาม';
  return {s:src==='BookMatch'?'ob':src==='โทร'?'oc':'ow',name:NAMES[hash(k)%NAMES.length],src,paid:src==='BookMatch'};
}

      else UI.sel={court:c,hours:[h]};});
  },
  toCheckout:()=>{if(!UI.sel)return;UI.co={venue:UI.venue,court:UI.sel.court,date:UI.date,hours:[...UI.sel.hours].sort((a,b)=>a-b),repeat:0,method:'promptpay'};go('checkout')},
  repeat:()=>keep(()=>UI.co.repeat=UI.co.repeat?0:4),
  weeks:d=>keep(()=>UI.co.repeat=+d.w),
  method:d=>keep(()=>UI.co.method=d.m),
  toPay:()=>{go('pay');if(UI.co.method==='promptpay'){let left=300;tick=setInterval(()=>{left--;const e=$('#cd');if(!e||left<=0){clearInterval(tick);tick=null;return}e.textContent=mmss(left)},1000)}},
  paid:()=>{if(tick){clearInterval(tick);tick=null}$('#paybody').innerHTML=`<div class="card" style="text-align:center;padding:40px 16px"><div class="spin"></div><h3>กำลังยืนยันการชำระเงิน</h3><p class="mut sm-t">รอสักครู่</p></div>`;setTimeout(confirmBooking,1300)},
  ticket:d=>{const b=D.bookings.find(x=>x.id===d.id),v=V(b.venue);openSheet(`<h2>ตั๋วเข้าสนาม</h2><div class="sub">แสดง QR นี้ที่เคาน์เตอร์สนาม</div><div class="card qrwrap"><div class="qr" style="border:0">${qrSvg(b.id+d.on)}</div><b style="letter-spacing:1px">${b.id}</b><div class="mut" style="font-size:15px">${v.name} · ${v.courts[b.court]}<br>${fmtLong(d.on)} · ${range(b.hours)}</div></div><button class="btn ghost block" data-a="closeSheet">ปิด</button>`)},
  cancel:d=>{const b=D.bookings.find(x=>x.id===d.id),v=V(b.venue),hrsLeft=(parse(d.on).getTime()+b.hours[0]*36e5-Date.now())/36e5,full=hrsLeft>=24;
    openSheet(`<h2>ยกเลิกการจองนี้?</h2><div class="sub">${v.name} · ${v.courts[b.court]} · ${fmtDate(d.on)} ${range(b.hours)}</div>
     <div class="note ${full?'green':'amber'}">${ic('info',16)}<span>${full?'ยกเลิกก่อน 24 ชม. คืนเงินเต็มจำนวนภายใน 3–5 วันทำการ':'เหลือเวลาไม่ถึง 24 ชม. คืนเงิน 50% ตามกติกาสนาม'}</span></div>
     <div class="note">${ic('queue',16)}<span>ช่วงเวลานี้จะถูกเสนอให้คนในคิว MatchQueue ทันที สนามไม่เสียรายได้</span></div>
     ${b.repeat?`<p class="mut sm-t" style="margin-top:10px">การจองนี้เป็นแบบประจำ ยกเลิกเฉพาะครั้งนี้ ครั้งอื่นยังอยู่</p>`:''}
     <button class="btn danger block" data-a="doCancel" data-id="${b.id}" data-on="${d.on}" data-full="${full?1:0}">ยืนยันยกเลิก</button><button class="btn ghost block" data-a="closeSheet">ไม่ยกเลิก</button>`)},
  doCancel:d=>{const b=D.bookings.find(x=>x.id===d.id),v=V(b.venue),per=v.price*b.hours.length,refund=d.full==='1'?per:per/2;
    if(b.repeat&&b.repeat>1){const w=dayDiff(b.date,d.on)/7;
      if(w===0){b.date=addDays(b.date,7);b.repeat--;if(b.repeat===1)b.repeat=0}
      else{const rest=b.repeat-w-1;b.repeat=w===1?0:w;if(rest>0)D.bookings.push({...b,id:b.id+'-'+(w+2),date:addDays(d.on,7),repeat:rest>1?rest:0})}}
    else D.bookings=D.bookings.filter(x=>x!==b);
    b.hours.forEach(h=>D.released[skey(b.venue,b.court,d.on,h)]=true);
    closeSheet();notify('ยกเลิกการจองแล้ว',`คืนเงิน ${baht(refund)} ภายใน 3–5 วันทำการ · ส่งช่วงเวลาให้คิวถัดไปแล้ว`,'cancel');render()},
  simDone:()=>{const u=upcoming()[0];if(!u)return;D.done.push({id:u.id,on:u.on,venue:u.venue,court:u.court,hours:u.hours,rated:0});save();toast('ย้ายไปที่ "ที่ผ่านมา" แล้ว');keep(()=>UI.bkTab='past')},
  rate:d=>{UI.rate={id:d.id,on:d.on,stars:5,tags:[]};rateSheet()},
  star:d=>{UI.rate.stars=+d.s;rateSheet()},
  rtag:d=>{const t=UI.rate.tags;UI.rate.tags=t.includes(d.t)?t.filter(x=>x!==d.t):[...t,d.t];rateSheet()},
  sendRate:()=>{const r=UI.rate,p=D.done.find(x=>x.id===r.id&&x.on===r.on);p.rated=r.stars;D.reviews.unshift({venue:p.venue,stars:r.stars,tags:r.tags,at:Date.now()});closeSheet();notify('ขอบคุณสำหรับรีวิว','รีวิวของคุณช่วยให้ผู้เล่นคนอื่นเลือกสนามได้ง่ายขึ้น','star');render()},
  rebook:d=>{const p=D.done.find(x=>x.id===d.id&&x.on===d.on);let nd=p.on;while(nd<=TODAY)nd=addDays(nd,7);if(nd>days7()[6])nd=addDays(TODAY,1);UI.date=nd;const ok=p.hours.every(h=>slotState(p.venue,p.court,nd,h)==='free');openVenue(p.venue,ok?{court:p.court,hours:[...p.hours]}:null);if(!ok)toast('ช่วงเดิมไม่ว่าง เลือกเวลาใหม่ได้เลย')},
  joinQ:d=>{const k=skey(d.v,+d.c,d.d,+d.h);if(!D.queue.find(q=>q.key===k))D.queue.push({key:k,venue:d.v,court:+d.c,date:d.d,h:+d.h,pos:hash(k+'q')%3+1});closeSheet();notify('เข้าคิว MatchQueue แล้ว',`${V(d.v).name} · ${fmtDate(d.d)} ${hh(+d.h)} · ถ้ามีคนยกเลิก เราจะแจ้งคุณทันที`,'queue');keep(()=>{})},
  leaveQ:d=>{D.queue=D.queue.filter(q=>q.key!==d.k);closeSheet();toast('ออกจากคิวแล้ว');keep(()=>{})},
  pickAlt:d=>{closeSheet();const pre={court:+d.c,hours:[+d.h]};UI.date=d.d;if(d.v===UI.venue&&UI.view==='venue')keep(()=>UI.sel=pre);else openVenue(d.v,pre)},
  simCancel:d=>{const q=D.queue.find(x=>x.key===d.k);releaseSlot(q.venue,q.court,q.date,q.h);D.pendingOffer=null;notify(`สนามว่างแล้ว ยืนยันภายใน ${D.owner.qmin} นาที`,`${V(q.venue).name} · ${fmtDate(q.date)} ${hh(q.h)}`,'offer');render();setTimeout(()=>offerSheet(q),400)},
  takeOffer:d=>{const k=d.k.split('|');closeSheet();UI.co={venue:k[0],court:+k[1],date:k[2],hours:[+k[3]],repeat:0,method:'promptpay'};UI.timer=Date.now();UI.venue=k[0];go('checkout')},
  simRemind:()=>{const u=upcoming()[0];if(!u)return toast('ยังไม่มีการจอง ลองจองสนามก่อน');const v=V(u.venue);notify('อีก 2 ชม. ถึงเวลาเล่น',`${v.name} ${v.courts[u.court]} · ${range(u.hours)} · ออกเดินทางตอนนี้ทันเวลาพอดี`,'remind');render()},
  friend:d=>keep(()=>{const f=D.friends;D.friends=f.includes(d.f)?f.filter(x=>x!==d.f):[...f,d.f]}),
  mtCell:d=>{const team=['me',...D.friends];const ok=team.filter(p=>avail(p,d.d,+d.h));const nm=p=>p==='me'?'คุณ (Nice)':FN(p).name;
    openSheet(`<h2>${fmtLong(d.d)}</h2><div class="sub">${hh(+d.h)}–${hh(+d.h+1)} · ว่าง ${ok.length}/${team.length} คน</div><div class="card"><ul class="list">${team.map(p=>`<li><span>${nm(p)}</span><span style="color:${ok.includes(p)?'var(--brand)':'var(--red)'}">${ok.includes(p)?'ว่าง':'ไม่ว่าง'}</span></li>`).join('')}</ul></div>
     <button class="btn block" data-a="mtFind" data-d="${d.d}" data-h="${d.h}">หาสนามช่วงนี้${ok.length>1?` และชวน ${ok.length-1} คนที่ว่าง`:''}</button>`)},
  mtFind:d=>{const ok=D.friends.filter(p=>avail(p,d.d,+d.h));closeSheet();UI.invite=ok;go('mtvenues',{mt:{d:d.d,h:+d.h}})},
  mtSport:d=>keep(()=>UI.mtSport=d.s),
  mtBook:d=>{UI.date=UI.mt.d;openVenue(d.v,{court:+d.c,hours:[UI.mt.h]})},
  mtQueue:d=>{const x=V(d.v);const c=x.courts.findIndex((_,i)=>slotState(d.v,i,UI.mt.d,UI.mt.h)==='booked');queueSheet(d.v,Math.max(c,0),UI.mt.d,UI.mt.h)},
  toOwner:()=>{closeSheet();UI.mode='owner';UI.oTab='overview';render();scrollTo(0,0)},
  toPlayer:()=>{if(D.auth==='owner')D.auth='player';UI.mode='player';hist=[];UI.view='home';render();scrollTo(0,0);if(D.pendingOffer){const q=D.pendingOffer;D.pendingOffer=null;save();setTimeout(()=>offerSheet(q),400)}},
  oTab:d=>{UI.oTab=d.t;render();scrollTo(0,0)},
  oDate:d=>keep(()=>UI.oDate=d.d),
  oCell:d=>{const v=V(OWNER_V),c=+d.c,h=+d.h,dd=UI.oDate,k=skey(OWNER_V,c,dd,h),o=oState(c,dd,h),sub=`${v.courts[c]} · ${fmtDate(dd)} · ${hh(h)}–${hh(h+1)}`;
    if(o.s==='free')openSheet(`<h2>ช่วงเวลาว่าง</h2><div class="sub">${sub}</div><label class="field"><span>ชื่อลูกค้า</span><input id="wname" placeholder="เช่น คุณเอ ทีมบัญชี"></label>
      <div class="two"><button class="btn block" data-a="walkin" data-k="${k}" data-src="โทร">${ic('plus',16)} บันทึกโทรจอง</button><button class="btn ghost block" data-a="walkin" data-k="${k}" data-src="หน้าสนาม">${ic('plus',16)} จองหน้าสนาม</button></div>
      <button class="btn dark block" data-a="block" data-k="${k}">ปิดช่วงนี้เพื่อซ่อมบำรุง</button><p class="mut" style="font-size:13px;margin-top:8px">ช่วงที่บันทึกหรือปิดไว้จะแสดงเป็น "เต็ม" ในแอปผู้เล่นทันที กันจองชน</p>`);
    else if(o.s==='blocked')openSheet(`<h2>ช่วงนี้ปิดอยู่</h2><div class="sub">${sub}</div><button class="btn block" data-a="unblock" data-k="${k}">เปิดให้จองอีกครั้ง</button>`);
    else openSheet(`<h2>${esc(o.name)}</h2><div class="sub">${sub}</div><div class="card"><div class="row"><span class="mut">ช่องทาง</span><span>${o.src}</span></div><div class="row"><span class="mut">เบอร์โทร</span><span>08X-XXX-${String(hash(k)%9000+1000)}</span></div><div class="row"><span class="mut">การชำระเงิน</span><span>${o.paid?'ชำระผ่านแอปแล้ว '+baht(v.price):'จ่ายที่สนาม'}</span></div></div>
      ${o.name==='Nice'?'<p class="mut sm-t">การจองนี้มาจากมุมมองผู้เล่นของคุณ</p>':`<button class="btn ghost block" data-a="oRelease" data-c="${c}" data-d="${dd}" data-h="${h}" style="color:var(--red)">ลูกค้ายกเลิก ส่งต่อให้คิว MatchQueue</button>`}`)},
  walkin:d=>{const n=(($('#wname')||{}).value||'').trim()||'ลูกค้า';D.walkins[d.k]={name:n,src:d.src};delete D.released[d.k];closeSheet();toast('บันทึกการจองแล้ว');keep(()=>{})},
  block:d=>{D.blocks[d.k]=true;closeSheet();toast('ปิดช่วงเวลานี้แล้ว');keep(()=>{})},
  unblock:d=>{delete D.blocks[d.k];closeSheet();toast('เปิดให้จองแล้ว');keep(()=>{})},
  oRelease:d=>{const q=releaseSlot(OWNER_V,+d.c,d.d,+d.h);closeSheet();toast(q?'ส่งข้อเสนอให้ Nice (คิวที่ 1) แล้ว สลับไปมุมมองผู้เล่นเพื่อดู':'ส่งข้อเสนอให้ลูกค้าคิวที่ 1 แล้ว');keep(()=>{})},
  savePrice:()=>{const p=Math.round(+($('#oprice')||{}).value);if(!p||p<100)return toast('ใส่ราคาตั้งแต่ 100 บาทขึ้นไป');D.owner.price=p;applyOwner();save();toast(`บันทึกราคา ${baht(p)}/ชม. แล้ว แอปผู้เล่นเห็นราคาใหม่ทันที`);keep(()=>{})},
  qmin:d=>keep(()=>D.owner.qmin=+d.m),
  oToggle:d=>keep(()=>{D.owner[d.k]=!D.owner[d.k];toast(d.k==='boost'?(D.owner.boost?'เปิด Boost แล้ว สนามขึ้นอันดับแรกในแอปผู้เล่น':'ปิด Boost แล้ว'):(D.owner.weekly?'เปิดรับจองประจำแล้ว':'ปิดรับจองประจำแล้ว'))}),
  scope:()=>openSheet(`<h2>ขอบเขตของต้นแบบ</h2><div class="sub">อ้างอิงตาราง MoSCoW ในรายงานหัวข้อ 2.5</div><div class="card"><ul class="scope">
    <li><b style="color:var(--brand)">Must</b><span>ตารางสนามและเวลาว่าง, การจอง, จองประจำรายสัปดาห์, ชำระเงิน, แจ้งเตือน, ตารางจองของเจ้าของสนาม</span></li>
    <li><b style="color:var(--amber)">Should</b><span>MatchTime, MatchQueue, MatchPitch</span></li>
    <li><b class="mut">เพิ่มเติม</b><span>ค้นหาตามพื้นที่ด้วยหมุดบนแผนที่, รีวิวและจองซ้ำ, Boost และแพ็กเกจสนาม</span></li>
    <li><b class="mut">Could</b><span>MatchMake, Tournament, Streak (ยังไม่ทำในต้นแบบ)</span></li>
    <li><b class="mut">Won't</b><span>MatchAnalysis</span></li></ul></div><div class="note">${ic('info',16)}<span>ข้อมูลสนาม ลูกค้า และการชำระเงินเป็นข้อมูลสมมติทั้งหมด ไม่มีการตัดเงินจริง ตำแหน่งสนามบนแผนที่เป็นตำแหน่งสมมติ</span></div><button class="btn ghost block" data-a="closeSheet">ปิด</button>`),
  reset:()=>{closeSheet();const a=D.auth;D=fresh();D.auth=a;applyOwner();UI.invite=[];UI.sel=null;UI.sport='all';save();toast('รีเซ็ตข้อมูลแล้ว');tab('home')},
};
function rateSheet(){const r=UI.rate,p=D.done.find(x=>x.id===r.id&&x.on===r.on),v=V(p.venue);
  openSheet(`<h2>ให้คะแนนสนาม</h2><div class="sub">${v.name} · ${fmtDate(p.on)} ${range(p.hours)}</div>
   <div class="starpick">${[1,2,3,4,5].map(s=>`<button class="${s<=r.stars?'on':''}" data-a="star" data-s="${s}" aria-label="${s} ดาว">★</button>`).join('')}</div>
   <div class="tagpick">${RTAGS.map(t=>`<button class="chip ${r.tags.includes(t)?'on':''}" data-a="rtag" data-t="${t}">${t}</button>`).join('')}</div>
   <button class="btn block" style="margin-top:16px" data-a="sendRate">ส่งรีวิว</button>`)}
function confirmBooking(){
  const c=UI.co,{v,per,disc}=coAmounts();
  const id='BM-'+(hash(Date.now()+'')%9000+1000)+String.fromCharCode(65+hash(c.venue)%26);
  const b={id,venue:c.venue,court:c.court,date:c.date,hours:c.hours,repeat:c.repeat,paid:per-disc,invite:[...UI.invite],created:Date.now()};
  D.bookings.push(b);D.firstUsed=true;D.queue=D.queue.filter(q=>!(q.venue===c.venue&&q.court===c.court&&q.date===c.date&&c.hours.includes(q.h)));
  c.hours.forEach(h=>delete D.released[skey(c.venue,c.court,c.date,h)]);
  UI.last={...b,elapsed:UI.timer?Math.round((Date.now()-UI.timer)/1000):null};UI.timer=null;UI.co=null;
  hist=[];UI.view='success';render();scrollTo(0,0);
  notify('จองสำเร็จ',`${v.name} ${v.courts[c.court]} · ${fmtDate(c.date)} ${range(c.hours)} · รหัส ${id}`,'ok');
  if(b.invite.length){D.notifs.unshift({id:Date.now()+1,t:'ส่งคำชวนเพื่อนแล้ว',b:`${b.invite.map(i=>FN(i).name).join(', ')} ได้รับลิงก์ยืนยันการเล่น`,k:'invite',at:Date.now(),read:false});save()}
  UI.invite=[];
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();e.stopPropagation();f(el.dataset,el)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&$('#layer').innerHTML)closeSheet();
  if(e.key==='Enter'&&e.target.id==='areaq'){const b=document.querySelector('#areasug [data-a=pickArea]');if(b)b.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;$('#vlist').innerHTML=venueList()}if(e.target.id==='areaq')areaSuggest(e.target.value)});
let lastWide=matchMedia('(min-width:1100px)').matches;
addEventListener('resize',()=>{const w=matchMedia('(min-width:1100px)').matches;if(w!==lastWide&&UI.view==='map'&&UI.mode==='player'){lastWide=w;render()}else lastWide=w;if(MAP)MAP.invalidateSize()});
render();
</script>
</body>
</html>
